{% extends "base.html" %} {% block content %}
<h2><a href="{{ url_for('post') }}">Post</a></h2>
<h3>{{ amount }} posts</h3>
{% for post in posts %}
<div>
  <p>
    {{ post.author.username }}: <b>{{ post.body }}</b> <i>{{ post.time }}</i
    ><br />
    {% if post.image != "\\x00" %}
    <img class="image" src="{{ post.image }}" alt="BitchNigga" />
    {% endif %}
  </p>
</div>
{% endfor %} {% endblock %}
